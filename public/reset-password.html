<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>RedSecTools — Reset Password</title>
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="max-w-2xl mx-auto px-4 py-12">
    <header class="grid grid-cols-[1fr_3fr_1fr] items-center mb-10">
      <div></div>
      <div class="text-center">
        <h1 class="text-2xl font-bold">
          <a href="/" class="hover:underline transition-colors">
            <span class="text-accent">RedSec</span><span class="text-secondary">Tools</span>
          </a>
        </h1>
      </div>
      <div class="flex items-center gap-2 justify-end">
        <button type="button" class="theme-toggle" id="theme-toggle" title="Toggle theme">
          <svg class="w-5 h-5 dark-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg class="w-5 h-5 light-icon hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
      </div>
    </header>

    <div id="reset-form" class="max-w-sm mx-auto">
      <div class="card">
        <div class="text-center mb-5">
          <svg class="w-10 h-10 mx-auto mb-2 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
          <h2 class="text-lg font-semibold">Reset Password</h2>
          <p class="text-muted text-sm mt-1">Enter your new password below.</p>
        </div>
        <div class="space-y-3">
          <div class="relative">
            <input type="password" id="password" class="input-field pr-10" placeholder="New password (min 12 characters)" autofocus>
            <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-primary transition-colors" title="Toggle visibility">
              <svg class="w-4 h-4 eye-open" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              <svg class="w-4 h-4 eye-closed hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L6.59 6.59m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>
            </button>
          </div>
          <input type="password" id="confirm-password" class="input-field" placeholder="Confirm new password">
          <button type="button" id="reset-btn" class="btn-primary w-full justify-center">Reset Password</button>
        </div>
        <p id="reset-error" class="text-sm mt-3 text-center hidden text-error"></p>
      </div>
    </div>

    <div id="reset-success" class="max-w-sm mx-auto hidden">
      <div class="card text-center">
        <svg class="w-10 h-10 text-accent mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        <h2 class="text-lg font-semibold mb-1">Password Reset</h2>
        <p class="text-muted text-sm">Your password has been updated. You can now login with your new password.</p>
        <a href="/login" class="inline-block mt-4 text-accent hover:underline text-sm">Go to login</a>
      </div>
    </div>

    <div id="invalid-token" class="max-w-sm mx-auto hidden">
      <div class="card text-center">
        <svg class="w-10 h-10 mx-auto mb-2 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
        <h2 class="text-lg font-semibold mb-1">Invalid Link</h2>
        <p class="text-muted text-sm">This reset link is invalid, expired, or has already been used.</p>
        <a href="/login" class="inline-block mt-4 text-accent hover:underline text-sm">Go to login</a>
      </div>
    </div>

    <footer class="footer">&copy; <span class="current-year"></span> RedSec Offensive Security</footer>
  </div>
  <script type="module" src="/js/reset-password.js"></script>
  <script type="module" src="/js/theme.js"></script>
</body>
</html>
