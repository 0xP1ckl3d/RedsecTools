<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>RedSecWiki</title>
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page-wide py-10">
    <header class="flex justify-between items-center mb-8">
      <h1 class="text-2xl font-bold"><span class="text-accent">RedSec</span><span class="text-secondary">Wiki</span></h1>
      <div class="flex items-center gap-2">
        <div class="relative">
          <button id="burger-btn" class="burger-btn" aria-label="Menu" aria-expanded="false">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <nav id="burger-nav" class="burger-nav hidden"></nav>
        </div>
        <button type="button" class="theme-toggle" id="theme-toggle" title="Toggle theme">
          <svg class="w-5 h-5 dark-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg class="w-5 h-5 light-icon hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
      </div>
    </header>

    <div class="grid gap-6 lg:grid-cols-[320px_1fr]">
      <section class="card">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-lg font-semibold">Pages</h2>
          <button id="wiki-refresh-btn" type="button" class="btn-secondary text-sm">Refresh</button>
        </div>
        <input id="wiki-search" class="input-field mb-3" placeholder="Search wiki pages">
        <div id="wiki-pages-list" class="space-y-2 text-sm text-muted">Loading pages...</div>
      </section>
      <section class="card space-y-4">
        <div class="grid gap-3 md:grid-cols-2">
          <input id="wiki-title" class="input-field" placeholder="Page title">
          <input id="wiki-slug" class="input-field" placeholder="page-slug">
        </div>
        <textarea id="wiki-body" class="input-field min-h-[280px]" placeholder="# Heading"></textarea>
        <div class="flex gap-3">
          <button id="wiki-save-btn" type="button" class="btn-primary">Save Page</button>
          <button id="wiki-new-btn" type="button" class="btn-secondary">New Page</button>
        </div>
        <p id="wiki-msg" class="text-sm hidden"></p>
        <div class="card bg-elevated-item">
          <h3 class="text-sm font-semibold mb-3">Preview</h3>
          <div id="wiki-preview" class="space-y-3 text-sm text-muted">Start typing to preview the page.</div>
        </div>
      </section>
    </div>

    <footer class="footer">&copy; <span class="current-year"></span> RedSec Offensive Security</footer>
  </div>
  <script type="module" src="/js/burger-menu.js"></script>
  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/wiki.js"></script>
</body>
</html>
