<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>RedSecTools — Forgot Password</title>
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="max-w-2xl mx-auto px-4 py-12">
    <header class="grid grid-cols-[1fr_3fr_1fr] items-center mb-10">
      <div></div>
      <div class="text-center">
        <h1 class="text-2xl font-bold">
          <a href="/" class="hover:underline transition-colors">
            <span class="text-accent">RedSec</span><span class="text-secondary">Tools</span>
          </a>
        </h1>
      </div>
      <div class="flex items-center gap-2 justify-end">
        <button type="button" class="theme-toggle" id="theme-toggle" title="Toggle theme">
          <svg class="w-5 h-5 dark-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg class="w-5 h-5 light-icon hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
      </div>
    </header>

    <div id="request-form" class="max-w-sm mx-auto">
      <div class="card">
        <div class="text-center mb-5">
          <svg class="w-10 h-10 mx-auto mb-2 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
          <h2 class="text-lg font-semibold">Reset Password</h2>
          <p class="text-muted text-sm mt-1">Enter your email to receive a reset link</p>
        </div>
        <div class="space-y-3">
          <input type="email" id="email" class="input-field" placeholder="Email address" autofocus>
          <button type="button" id="request-btn" class="btn-primary w-full justify-center">Send Reset Link</button>
        </div>
        <p id="request-error" class="text-sm mt-3 text-center hidden text-error"></p>
        <p id="request-success" class="text-sm mt-3 text-center hidden text-accent"></p>
        <p class="text-sm mt-3 text-center">
          <a href="/login" class="text-accent hover:underline">Back to login</a>
        </p>
      </div>
    </div>

    <footer class="footer">&copy; <span class="current-year"></span> RedSec Offensive Security</footer>
  </div>
  <script type="module" src="/js/forgot-password.js"></script>
  <script type="module" src="/js/theme.js"></script>
</body>
</html>
