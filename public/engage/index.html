<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>RedSecEngage</title>
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
  <script src="/js/theme-init.js?v=20260509-engage"></script>
  <link rel="stylesheet" href="/css/style.css?v=20260509-engage">
  <link rel="stylesheet" href="/css/notifications.css">
  <link rel="stylesheet" href="/css/engage.css">
</head>
<body>
  <div class="dashboard-layout engage-dashboard-shell">
    <aside id="engage-sidebar" class="dashboard-sidebar collapsed">
      <button type="button" id="engage-sidebar-collapse-btn" class="sidebar-collapse-btn" title="Collapse sidebar">
        <svg class="sidebar-collapse-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </button>

      <nav class="sidebar-nav">
        <button type="button" class="sidebar-nav-item active" data-engage-view="dashboard">
          <svg class="sidebar-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          <span class="sidebar-nav-text">Dashboard</span>
        </button>
        <button type="button" class="sidebar-nav-item" data-engage-view="clients">
          <svg class="sidebar-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
          <span class="sidebar-nav-text">Clients</span>
        </button>
        <button type="button" class="sidebar-nav-item" data-engage-view="pipeline">
          <svg class="sidebar-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
          <span class="sidebar-nav-text">Pipeline</span>
        </button>
        <button type="button" class="sidebar-nav-item" data-engage-view="engagements">
          <svg class="sidebar-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
          <span class="sidebar-nav-text">Engagements</span>
        </button>
        <button type="button" class="sidebar-nav-item" data-engage-view="qa">
          <svg class="sidebar-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span class="sidebar-nav-text">QA Queue</span>
        </button>
        <button type="button" class="sidebar-nav-item" data-engage-view="utilisation">
          <svg class="sidebar-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <span class="sidebar-nav-text">Utilisation</span>
        </button>
      </nav>

      <div class="sidebar-divider"></div>

      <nav class="sidebar-nav">
        <button type="button" class="sidebar-nav-item" data-engage-view="about">
          <svg class="sidebar-nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M12 20.5a8.5 8.5 0 100-17 8.5 8.5 0 000 17z"/></svg>
          <span class="sidebar-nav-text">About</span>
        </button>
      </nav>
    </aside>

    <div class="dashboard-content">
      <header class="dashboard-header">
        <div>
          <h1 class="text-xl font-bold">
            <a href="/" class="hover:underline transition-colors">
              <span class="text-accent" data-bp>RedSec</span><span class="text-secondary">Engage</span>
            </a>
          </h1>
          <p class="text-sm text-muted mt-1">Engagement workspace and operational command centre.</p>
        </div>
        <div class="flex items-center gap-2">
          <div class="relative">
            <button id="burger-btn" class="burger-btn" aria-label="Menu" aria-expanded="false">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <nav id="burger-nav" class="burger-nav hidden"></nav>
          </div>
          <button type="button" class="theme-toggle" id="theme-toggle" title="Toggle theme">
            <svg class="w-5 h-5 dark-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <svg class="w-5 h-5 light-icon hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          </button>
        </div>
      </header>

      <div class="mobile-tabs">
        <button type="button" class="mobile-tab active" data-engage-view="dashboard">Dashboard</button>
        <button type="button" class="mobile-tab" data-engage-view="clients">Clients</button>
        <button type="button" class="mobile-tab" data-engage-view="pipeline">Pipeline</button>
        <button type="button" class="mobile-tab" data-engage-view="engagements">Engagements</button>
        <button type="button" class="mobile-tab" data-engage-view="qa">QA Queue</button>
        <button type="button" class="mobile-tab" data-engage-view="utilisation">Utilisation</button>
        <button type="button" class="mobile-tab" data-engage-view="about">About</button>
      </div>

      <div class="dashboard-main">
        <div id="engage-app" class="engage-dashboard">
          <div id="engage-loading" class="engage-empty">Loading dashboard...</div>
          <div id="engage-error" class="engage-empty hidden"></div>
          <div id="engage-content" class="hidden"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/theme.js?v=20260509-engage"></script>
  <script type="module" src="/js/burger-menu.js?v=20260509-engage"></script>
  <script src="/js/notifications.js?v=20260509-engage"></script>
  <script src="/js/engage/engage-api.js?v=20260510-p4"></script>
  <script src="/js/engage/engage-clients.js?v=20260510-p4"></script>
  <script src="/js/engage/engage-opportunities.js?v=20260510-p4"></script>
  <script src="/js/engage/engage-engagements.js?v=20260511-p5"></script>
  <script src="/js/engage/engage-qa.js?v=20260511-p6"></script>
  <script src="/js/engage/engage-utilisation.js?v=20260511-p7"></script>
  <script type="module" src="/js/engage/engage-app.js?v=20260511-p7"></script>
