name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          COOKIE_SECRET: ci-cookie-secret-ci-cookie-secret-32
          REDSECAI_AUTOSTART: "false"
          REDSECAI_AUTO_PULL: "false"

      - name: Route contracts and migrations
        run: node --test tests/route-contracts.test.js tests/migrations.test.js
        env:
          NODE_ENV: test
          COOKIE_SECRET: ci-cookie-secret-ci-cookie-secret-32
          REDSECAI_AUTOSTART: "false"
          REDSECAI_AUTO_PULL: "false"

      - name: Build frontend assets
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev
