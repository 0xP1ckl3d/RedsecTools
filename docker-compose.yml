services:
  redsectools:
    build: .
    container_name: redsectools
    depends_on:
      tor-proxy:
        condition: service_started
      redsecai:
        condition: service_healthy
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-3000}:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - TOR_PROXY=socks5h://tor-proxy:9050
      - REDSECAI_ENABLED=${REDSECAI_ENABLED:-true}
      - REDSECAI_BASE_URL=http://redsecai:11434
      - REDSECAI_MODEL=${REDSECAI_MODEL:-qwen3.5:4b}
      - REDSECAI_TIMEOUT_MS=${REDSECAI_TIMEOUT_MS:-120000}
      - REDSECAI_AUTOSTART=false
    volumes:
      - redsectools-data:/app/data
    restart: unless-stopped
  redsecai:
    build:
      context: ./docker/redsecai
    container_name: redsectools-ai
    environment:
      - OLLAMA_MODEL=${REDSECAI_MODEL:-qwen3.5:4b}
    volumes:
      - redsectools-ai:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
  tor-proxy:
    image: dperson/torproxy:latest
    container_name: redsectools-tor
    restart: unless-stopped

volumes:
  redsectools-data:
  redsectools-ai:
