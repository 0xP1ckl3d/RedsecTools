services:
  redsectools:
    build: .
    container_name: redsectools
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      - redsectools-data:/app/data
    restart: unless-stopped

volumes:
  redsectools-data:
